name: Deploy v2 Stack

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy FinBot v2
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to VPS
        run: |
          set -e
          TARGET="/root/crypto-bot"
          mkdir -p "$TARGET"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'scratch' \
            --exclude 'services/fb-ml-training/data' \
            --exclude 'fb-mare' \
            "$GITHUB_WORKSPACE/" "$TARGET/"
          echo "Synced to $TARGET"

      - name: Sync Maré service
        working-directory: /root/crypto-bot
        run: |
          set -e
          if [ -d fb-mare/.git ]; then
            git -C fb-mare pull --ff-only
          else
            git clone https://github.com/FinBot-Crypto/fb-mare.git fb-mare
          fi
          DB_USER=$(sed -n 's/^DB_USER=//p' .env)
          DB_NAME=$(sed -n 's/^DB_NAME=//p' .env)
          docker exec -i crypto-postgres psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" < fb-mare/migrations/001_mare_schema.sql

      - name: Stop legacy stack
        working-directory: /root/crypto-bot
        run: |
          set +e
          LEGACY="fb-market-selection fb-strategy-ml fb-decision-engine fb-trade-decision \
            fb-execution fb-execution-futures fb-position-management fb-analytics fb-web-dashboard"
          for c in $LEGACY; do
            docker stop "$c" 2>/dev/null && docker rm "$c" 2>/dev/null || true
          done
          set -e

      - name: Build and start v2
        working-directory: /root/crypto-bot
        run: |
          set -e
          docker compose build --parallel
          docker compose up -d
          docker compose -f docker-compose.yml -f fb-mare/docker-compose.mare.yml build fb-mare
          docker compose -f docker-compose.yml -f fb-mare/docker-compose.mare.yml up -d fb-mare
          sleep 5
          docker compose ps

      - name: Health check
        run: |
          docker ps --filter name=fb-core --filter name=fb-leme --filter name=fb-mare --format '{{.Names}} {{.Status}}'
          curl -sf http://localhost:8000/api/status || echo "Dashboard warming up..."
